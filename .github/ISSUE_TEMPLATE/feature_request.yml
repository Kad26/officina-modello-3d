name: ✨ Feature request
description: An idea for something SketchCraft should do.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Requests we take on go into [FEATURE-REQUESTS.md](https://github.com/jasonsutter87/sketchcraft/blob/main/FEATURE-REQUESTS.md) with their status.
        Please search existing requests first and 👍 the one you want instead of opening a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job or problem, in your own words. This matters more than the solution.
      placeholder: "When I model a deck, I have to draw every board by hand…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mockups, sketches or "SketchUp does it like this" are great.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drawing & modeling tools
        - Components & groups
        - Materials, textures & rendering
        - Import / export
        - Themes & layout
        - Plugins & scripting (JS / Ruby)
        - AI agents / MCP
        - Learning & help
        - Other
  - type: dropdown
    id: importance
    attributes:
      label: How much would this help you?
      options:
        - Nice to have
        - It would save me real time
        - I can't use SketchCraft for my work without it
